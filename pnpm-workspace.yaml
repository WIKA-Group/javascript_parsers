# Minimum release age in minutes before a package version can be installed (7 days)
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

# Fail installation when peer dependencies are missing or incompatible
strictPeerDependencies: true

# Prevent lifecycle scripts from untrusted packages
ignoreScripts: true
shellEmulator: true

packages:
  - packages/*
  - examples/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
