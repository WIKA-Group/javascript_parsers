name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  release:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache mise downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      - name: Install tools with mise
        uses: jdx/mise-action@v5
        with:
          cache: false

      - name: Install deps
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          body: |
            Please refer to the [release notes](https://github.com/WIKA-Group/javascript_parsers?tab=readme-ov-file#release-notes).

      - name: Upload binaries to release
        if: steps.create_release.outcome == 'success'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: parsers.zip
          asset_name: wika_javascript_parsers_${{ github.ref_name }}.zip
          tag: ${{ github.ref_name }}
          overwrite: true

      - name: Release parsers and raw parsers npm package
        if: steps.create_release.outcome == 'success'
        run: pnpm --filter './packages/**' -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
